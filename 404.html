<body data-page="404">
<!--
  Bu sayfa iki işe yarar:
  1) Henüz SEO sayfası üretilmemiş yeni ürün/yazı adreslerini (/urun/..., /yazi/...) açar.
  2) Diğer bulunamayan adreslerde "sayfa bulunamadı" gösterir.
-->
<main id="notFound" hidden>
  <div class="container empty" style="padding:120px 20px">
    <h1 style="font-size:30px;font-weight:500;margin-bottom:10px">Sayfa bulunamadı</h1>
    <p style="margin-bottom:20px">Aradığınız sayfa taşınmış ya da kaldırılmış olabilir.</p>
    <a href="index.html" class="btn btn--green">Anasayfaya Dön</a>
  </div>
</main>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20261105d"></script>
<script src="js/render.js?v=20261105d"></script>
<script src="js/common.js?v=20261105d"></script>
<script>
(function(){
  var path = location.pathname;
  var page = /\/urun\/[^/]+\/?$/.test(path) ? "product" : /\/yazi\/[^/]+\/?$/.test(path) ? "post" : "";
  if(page){
    var s = document.createElement("script");
    s.src = "js/" + page + ".js?v=20261105d";
    document.body.appendChild(s);
  } else {
    renderLayout("");
    document.getElementById("notFound").hidden = false;
  }
})();
</script>
</body>
</html>
